name: iliving
description: A luxury Real Estate and Brokerage Management Application modeled after DAMAC 360.
version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.5
  url_launcher: ^6.1.11
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  firebase_core: ^2.30.0
  cloud_firestore: ^4.17.0
  firebase_auth: ^4.19.0
  firebase_storage: ^11.7.0
  cached_network_image: ^3.3.1
  crypto: ^3.0.3
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.13.1
  google_generative_ai: ^0.4.6
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - images/skyhills/
    - images/lamar/
    - images/zayed_lagoons/
    - assets/
    - assets/erp_seed_data.json
