name: Enterprise Hardening CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # Setup Python environment for backend verification
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-on-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # Add fitz/PyMuPDF if parsing tests are added
        pip install pymupdf || true

    - name: Run Backend Hardening Tests
      run: |
        python3 test_backend_hardening.py

    # Setup Flutter environment for application checks
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.10.0'
        channel: 'stable'

    - name: Install Flutter Dependencies
      run: flutter pub get

    - name: Check Formatting
      run: flutter format --set-exit-if-changed lib/

    - name: Run Static Analysis
      run: flutter analyze --no-fatal-infos

    - name: Run Unit Tests
      run: flutter test
